name: Build & Release Official Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Etiqueta de la versión (ej. v7.8.4)'
        required: true
        default: 'v7.8.4'
      release_name:
        description: 'Título del Release'
        required: true
        default: 'VortexCore Hub v7.8.4 // Tactical Armoury Edition'
      draft:
        description: '¿Crear como borrador (Draft)?'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '¿Marcar como versión preliminar (Prerelease)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Compilar Instalador Standalone .exe (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Entorno Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 📦 Instalar Dependencias de Compilación
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: ⚙️ Compilar Binario Nativo con PyInstaller
        run: |
          pyinstaller vortex_core_hub.spec --noconfirm --clean

      - name: 🛠️ Instalar Inno Setup y Compilar Instalador Oficial
        shell: powershell
        run: |
          choco install innosetup --no-progress
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $paths = @(
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            )
            $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          Write-Host "Compilando installer.iss con $iscc"
          & $iscc "$PWD\installer.iss"

      - name: 🗜️ Generar Paquete Portátil y Sumas de Verificación
        shell: powershell
        run: |
          Compress-Archive -Path "dist\VortexCoreHub\*" -DestinationPath "dist\VortexCoreHub-v7.8.4-Portable.zip" -Force
          $setupHash = (Get-FileHash dist\Vortex-core-hub-Setup.exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash dist\VortexCoreHub-v7.8.4-Portable.zip -Algorithm SHA256).Hash
          "$setupHash  Vortex-core-hub-Setup.exe`r`n$zipHash  VortexCoreHub-v7.8.4-Portable.zip" | Out-File -Encoding ascii dist\checksums-sha256.txt
          Write-Host "SHA256 Setup: $setupHash"
          Write-Host "SHA256 Portable: $zipHash"

      - name: 🚀 Publicar Release en GitHub con Setup.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          name: ${{ inputs.release_name || 'VortexCore Hub v7.8.4 // Tactical Armoury Edition' }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            dist/Vortex-core-hub-Setup.exe
            dist/VortexCoreHub-v7.8.4-Portable.zip
            dist/checksums-sha256.txt
          body: |
            # 🌀 VortexCore Hub v7.8.4 // Tactical Armoury Edition
            
            **Desarrollado por [Faundezz21](https://github.com/Faundezz21)**  
            *Centro de control táctico de hardware, telemetría en vivo estilo Armoury/TUF, detección instantánea de mandos 2.4GHz/BT y suite de inicio/debloat.*

            ---

            ### 📦 Descargas Oficiales
            * **Instalador Oficial Recomendado**: [`Vortex-core-hub-Setup.exe`](https://github.com/Faundezz21/VortexCore-Hub/releases/download/${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}/Vortex-core-hub-Setup.exe) *(Con asistente visual, ícono oficial, accesos directos y desinstalador limpio)*.
            * **Versión Portátil (Sin instalación)**: [`VortexCoreHub-v7.8.4-Portable.zip`](https://github.com/Faundezz21/VortexCore-Hub/releases/download/${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}/VortexCoreHub-v7.8.4-Portable.zip).
            * **Sumas de Verificación (SHA-256)**: [`checksums-sha256.txt`](https://github.com/Faundezz21/VortexCore-Hub/releases/download/${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}/checksums-sha256.txt).

            > 💡 **Nota:** Esta suite viene **100% empaquetada**. **NO requiere tener Python instalado**. Solo haz doble clic y se abrirá de inmediato.

            ---

            ### 🛠️ Novedades y Mejoras Principales en v7.8.4:
            * **🎨 Nuevo Diseño Táctico "Tactical Armoury" (VortexCore Hub)**:
              * Interfaz oscura mate en negro carbón y ámbar táctico con barra lateral compacta y biseles diagonales (`\\\`).
              * Showcase visual 3D del equipo detectado con emblema luminoso **VORTEX CORE HUB** y especificaciones reales de CPU y GPU.
              * Cuadrícula táctica **Uso del sistema** (`CPU`, `GPU`, `Ventilador`, `Memoria`) con barras de frecuencia en MHz, uso, voltaje (mV), temperatura (°C), acústica (dBA) y almacenamiento total en GB.
              * Barra inferior de **Modo operativo** con 5 modos directos: `Windows®`, `Silencio`, `Rendimiento`, `Turbo` y `Manual`.
            * **🎮 Detección Instantánea de Mandos y Periféricos (2.4 GHz & Bluetooth en <25ms)**:
              * Integración nativa con APIs Win32 en C (`XInputGetState`, `winmm.joyGetPosEx`, `CfgMgr32` y `MMDevices`) sin bloqueos de PowerShell.
              * Detecta en tiempo real al encender cualquier mando Xbox, DualSense PS5/PS4, receptores inalámbricos USB 2.4 GHz y auriculares Bluetooth/Dongle.
            * **🚀 Gestor Nativo de Inicio de Windows (`StartupApproved\Run`)**:
              * Sincronización 100% real y bidireccional con el Administrador de Tareas de Windows 10/11 al habilitar o deshabilitar aplicaciones de arranque.
            * **🧹 Limpiador y Debloat de Windows (Microsoft Edge 100% Protegido)**.

            ---

            ### 💻 Requisitos del Sistema:
            * **Sistema Operativo**: Windows 11 o Windows 10 (64 bits).
            * **Permisos**: Requiere permisos de Administrador para controlar ventiladores, inicio y memoria RAM.
