name: Build & Release Official Installer

# La versión sale SIEMPRE del archivo VERSION (única fuente de verdad).
# Las notas del release se toman de la sección correspondiente de CHANGELOG.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Título del Release (vacío = "VortexCore Hub vX.Y.Z")'
        required: false
        default: ''
      draft:
        description: '¿Crear como borrador (Draft)?'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '¿Marcar como versión preliminar (Prerelease)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Compilar Instalador Standalone .exe (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🏷️ Leer Versión (archivo VERSION)
        id: version
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION inválido: '$version'" }
          $tag = "v$version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "El tag '${{ github.ref_name }}' no coincide con VERSION ($tag). Actualiza VERSION o el tag."
          }
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "tag=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Versión: $version (tag $tag)"

      - name: 🐍 Configurar Entorno Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 📦 Instalar Dependencias de Compilación
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: 🧪 Ejecutar Pruebas
        run: python -m unittest discover -s tests -v

      - name: ⚙️ Compilar Binario Nativo con PyInstaller
        run: |
          pyinstaller vortex_core_hub.spec --noconfirm --clean

      - name: 🛠️ Instalar Inno Setup y Compilar Instalador Oficial
        shell: powershell
        run: |
          choco install innosetup --no-progress
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $paths = @(
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            )
            $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          Write-Host "Compilando installer.iss con $iscc"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "$PWD\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con código $LASTEXITCODE" }

      - name: 🗜️ Generar Paquete Portátil y Sumas de Verificación
        shell: powershell
        run: |
          $zipName = "VortexCoreHub-${{ steps.version.outputs.tag }}-Portable.zip"
          Compress-Archive -Path "dist\VortexCoreHub\*" -DestinationPath "dist\$zipName" -Force
          $setupHash = (Get-FileHash dist\Vortex-core-hub-Setup.exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash "dist\$zipName" -Algorithm SHA256).Hash
          "$setupHash  Vortex-core-hub-Setup.exe`r`n$zipHash  $zipName" | Out-File -Encoding ascii dist\checksums-sha256.txt
          Write-Host "SHA256 Setup: $setupHash"
          Write-Host "SHA256 Portable: $zipHash"

      - name: 📝 Generar Notas del Release desde CHANGELOG.md
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          import os, re
          version, tag = os.environ["VERSION"], os.environ["TAG"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              raise SystemExit(f"CHANGELOG.md no tiene una sección '## {version}'")
          base = f"https://github.com/${{ github.repository }}/releases/download/{tag}"
          notes = f"""# 🌀 VortexCore Hub {tag}

          **Desarrollado por [Faundezz21](https://github.com/Faundezz21)**

          ### 📦 Descargas Oficiales
          * **Instalador Oficial Recomendado**: [`Vortex-core-hub-Setup.exe`]({base}/Vortex-core-hub-Setup.exe) *(asistente de instalación, accesos directos y desinstalador limpio)*.
          * **Versión Portátil (Sin instalación)**: [`VortexCoreHub-{tag}-Portable.zip`]({base}/VortexCoreHub-{tag}-Portable.zip).
          * **Sumas de Verificación (SHA-256)**: [`checksums-sha256.txt`]({base}/checksums-sha256.txt).

          > 💡 **Nota:** Esta suite viene **100% empaquetada**. **NO requiere tener Python instalado**.

          ---

          ## Novedades en {tag}
          {{changes}}

          ---

          ### 💻 Requisitos del Sistema
          * **Sistema Operativo**: Windows 11 o Windows 10 (64 bits).
          * **Permisos**: Requiere permisos de Administrador para controlar ventiladores, inicio y memoria RAM.
          """
          notes = notes.replace("{changes}", m.group(1).strip())
          open("release_notes.md", "w", encoding="utf-8").write(notes)
          print(notes)

      - name: 🚀 Publicar Release en GitHub con Setup.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ inputs.release_name || format('VortexCore Hub {0}', steps.version.outputs.tag) }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          body_path: release_notes.md
          files: |
            dist/Vortex-core-hub-Setup.exe
            dist/VortexCoreHub-${{ steps.version.outputs.tag }}-Portable.zip
            dist/checksums-sha256.txt
